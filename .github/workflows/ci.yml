name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS exercises the Core Text backend and the golden test; Linux
        # proves the package still imports and degrades cleanly without it.
        os: [macos-latest, ubuntu-latest]
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango1.0-dev libcairo2-dev ffmpeg

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[coretext]" --group dev

      - name: Test
        run: python -m pytest -q

      - name: Lint
        run: |
          python -m pip install ruff
          ruff check .
          ruff format --check .
